#CI项目
name: CWRT-ALL

#CI计划
on:
  #自动编译：每周一早上5点
  schedule:
    - cron: 0 18 * * *
  #手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: false
        required: false
        type: boolean

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

#CI权限
permissions: write-all

#CI任务
jobs:
  #防重复运行：若同名工作流 CWRT-ALL 已有实例在运行，则跳过本次构建
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check for concurrent runs
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          WORKFLOW_FILE="CWRT-ALL.yml"
          CURRENT_RUN_ID="${{ github.run_id }}"

          echo "当前运行 ID: $CURRENT_RUN_ID"

          #查询同名工作流中处于 in_progress / queued 的运行（排除自身）
          RUN_IDS="$(gh api \
            "repos/${{ github.repository }}/actions/workflows/${WORKFLOW_FILE}/runs?status=in_progress&status=queued&per_page=100" \
            --jq '.workflow_runs[].id')"

          SKIP="false"
          while IFS= read -r RID; do
            [ -z "$RID" ] && continue
            [ "$RID" = "$CURRENT_RUN_ID" ] && continue
            echo "发现同名编译任务正在运行（run id: $RID），跳过本次构建。"
            SKIP="true"
            break
          done <<< "$RUN_IDS"

          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

  cleanup:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Delete old Releases and Workflows
        uses: ophub/delete-releases-workflows@main
        with:
          gh_token: ${{secrets.GITHUB_TOKEN}}
          delete_releases: true
          releases_keep_latest: 15
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 0

  config:
    needs: cleanup
    name: ${{matrix.CONFIG}}
    strategy:
      fail-fast: false
      #max-parallel: 4
      matrix:
        CONFIG: [MT7981, MT7986]
        REPO_INFO:
          - {SOURCE: "Yuzhii0718/immortalwrt-mt798x-6.6-padavanonly", BRANCH: "openwrt-24.10-6.6"}
          #- {SOURCE: "chasey-dev/immortalwrt-mt798x-rebase", BRANCH: "25.12"}

    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置
      WRT_CONFIG: ${{matrix.CONFIG}}
      #默认主题
      WRT_THEME: aurora
      #默认主机名
      WRT_NAME: TK-WRT
      #默认WIFI名称
      WRT_SSID: TK-WRT
      #默认WIFI密码
      WRT_WORD: tk12345678
      #默认地址
      WRT_IP: 192.168.99.1
      #默认密码，仅作提示，修改无用
      WRT_PW: xxxx
      #源码链接
      WRT_REPO: https://github.com/${{matrix.REPO_INFO.SOURCE}}.git
      #源码分支
      WRT_BRANCH: ${{matrix.REPO_INFO.BRANCH}}
      #源码名称
      WRT_SOURCE: ${{matrix.REPO_INFO.SOURCE}}
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #仅输出配置文件
      WRT_TEST: ${{inputs.TEST || false}}
